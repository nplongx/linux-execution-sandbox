[package]
name = "runalith-linux-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Fail-closed Linux Bubblewrap execution and capability-scoped workspace writes"
repository = "https://github.com/nplongx/runalith-linux-sandbox"
readme = "README.md"
keywords = ["linux", "bubblewrap", "sandbox", "cgroup-v2"]
categories = ["os", "development-tools"]

[dependencies]
content-artifacts = { version = "=0.1.0", git = "https://github.com/nplongx/content-artifacts", rev = "f01210cfaed5e4c8310a3afca1334b070586038e" }
hex = "=0.4.3"
libc = "=0.2.189"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
